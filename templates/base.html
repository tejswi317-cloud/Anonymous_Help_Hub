<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Anonymous Help Hub
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        Anonymous Help Hub
    </div>

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('ask') }}">
            Ask for Help
        </a>

        <a href="{{ url_for('questions') }}">
            Help Someone
        </a>

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        Ask without fear. Help without judgment.
    </p>

    <p>
        Stay anonymous. Never share passwords,
        financial information or private addresses.
    </p>

</footer>

</body>

</html>
